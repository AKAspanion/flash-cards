name: Preview

# Deploys each pull request to a temporary Firebase Hosting channel (expires in 7 days)
# and comments the URL on the PR. Skipped for forks, which can't read the secrets.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      VUE_APP_API_KEY: ${{ vars.VUE_APP_API_KEY }}
      VUE_APP_AUTH_DOMAIN: ${{ vars.VUE_APP_AUTH_DOMAIN }}
      VUE_APP_DATABASE_URL: ${{ vars.VUE_APP_DATABASE_URL }}
      VUE_APP_PROJECT_ID: ${{ vars.VUE_APP_PROJECT_ID }}
      VUE_APP_STORAGE_BUCKET: ${{ vars.VUE_APP_STORAGE_BUCKET }}
      VUE_APP_MESSAGING_SENDER_ID: ${{ vars.VUE_APP_MESSAGING_SENDER_ID }}
      VUE_APP_APP_ID: ${{ vars.VUE_APP_APP_ID }}
      VUE_APP_MEASUREMENT_ID: ${{ vars.VUE_APP_MEASUREMENT_ID }}
      VUE_APP_PLAY_STORE_URL: ${{ vars.VUE_APP_PLAY_STORE_URL }}
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip until deploy settings exist
        if: ${{ env.HAS_SERVICE_ACCOUNT != 'true' || vars.FIREBASE_PROJECT_ID == '' }}
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT secret or FIREBASE_PROJECT_ID variable not set; skipping preview deploy."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.HAS_SERVICE_ACCOUNT == 'true' && vars.FIREBASE_PROJECT_ID != '' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.HAS_SERVICE_ACCOUNT == 'true' && vars.FIREBASE_PROJECT_ID != '' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: ${{ env.HAS_SERVICE_ACCOUNT == 'true' && vars.FIREBASE_PROJECT_ID != '' }}
        run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        if: ${{ env.HAS_SERVICE_ACCOUNT == 'true' && vars.FIREBASE_PROJECT_ID != '' }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
          firebaseToolsVersion: 15.34.2
