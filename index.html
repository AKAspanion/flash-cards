<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E91E63" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="FlashCards: a learning and memorization helper app." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />
    <title>FlashCards</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ECECEC;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ECECEC;
        opacity: 1;
        transition: opacity 300ms ease-out;
      }
      #boot-splash img {
        width: 300px;
        height: 300px;
      }
      .boot-splash--hiding {
        opacity: 0;
      }
    </style>
    <script src="/early-paint.js"></script>
  </head>
  <body>
    <noscript>
      <style>
        #boot-splash {
          display: none;
        }
      </style>
      <strong>FlashCards needs JavaScript to work. Please enable it to continue.</strong>
    </noscript>
    <div id="boot-splash" aria-hidden="true"><img src="/img/splash.png" alt="" /></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
